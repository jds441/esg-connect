<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://fnkhosoifmhutlaxpjfu.supabase.co; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>ESG Suite (TEST) - connect Claude</title>
<style>
  html { display:none; }
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5b6470; --line:#d7dce2; --accent:#0b6b4f; --bad:#a3261b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --card:#1d2125; --ink:#e7eaee; --muted:#9aa4af; --line:#333a41; --accent:#43b78f; --bad:#ff8a7f; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:460px; margin:48px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; } .tag { color:var(--muted); font-size:14px; margin:0 0 20px; }
  label { display:block; font-size:14px; margin:12px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; font:inherit; }
  button { margin-top:16px; padding:9px 16px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.secondary { background:transparent; color:var(--ink); border-color:var(--line); margin-left:8px; }
  button:disabled { opacity:.5; cursor:default; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; } dt { color:var(--muted); } dd { margin:0; word-break:break-all; }
  #msg { margin-top:16px; font-size:14px; } #msg.bad { color:var(--bad); }
  #diag { margin-top:16px; font:12px/1.4 ui-monospace, Consolas, monospace; color:var(--muted); white-space:pre-wrap; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Connect Claude to the ESG Suite</h1>
    <p class="tag">TEST area. Test logins only.</p>
    <form id="signin" autocomplete="on">
      <label for="email">Work email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button id="go" type="submit">Sign in</button>
    </form>
    <section id="consent" hidden>
      <p><b id="who"></b>, Claude is asking to connect to the ESG Suite (TEST).</p>
      <dl>
        <dt>Application</dt><dd id="cname"></dd>
        <dt>Returns to</dt><dd id="cred"></dd>
        <dt>Scopes</dt><dd id="cscope"></dd>
        <dt>It can</dt><dd>Read who you are (staff id, name, company, area). Nothing else, and no changes.</dd>
      </dl>
      <button id="approve" type="button">Approve</button><button id="deny" class="secondary" type="button">Deny</button>
    </section>
    <p id="msg" role="status"></p>
    <div id="diag"></div>
  </div>
</main>
<script src="supabase-2.118.0.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"></script>
<script src="consent.js?v=2aa7cfa4b12d" integrity="sha384-LJjxsQXNXbsiHsHRR44sWWZaHyGtIFSaxRgO7t8o3FhArh3k1YvYUFaAc9kzBsya"></script>
</body>
</html>
